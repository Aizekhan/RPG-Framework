name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta-check:
    name: Unity .meta integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -I .github/scripts/check_meta.py .

  unity-tests:
    name: ${{ matrix.mode }} tests (Unity 6000.0.45f1)
    runs-on: ubuntu-latest
    needs: meta-check
    strategy:
      fail-fast: false
      matrix:
        mode: [editmode, playmode]
    permissions:
      contents: read
      checks: write # unity-test-runner publishes results as a check run
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity license secrets
        id: license
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning::Unity tests SKIPPED: set UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets (see https://game.ci/docs/github/activation)."
            echo "### ⚠️ Unity ${{ matrix.mode }} tests were NOT run (license secrets missing)" >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.license.outputs.available == 'true'

      - uses: actions/cache@v4
        if: steps.license.outputs.available == 'true'
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef', 'Packages/**/*.asmdef') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        if: steps.license.outputs.available == 'true'
        id: tests
        with:
          unityVersion: 6000.0.45f1
          testMode: ${{ matrix.mode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.mode }} results

      - uses: actions/upload-artifact@v4
        if: always() && steps.license.outputs.available == 'true'
        with:
          name: ${{ matrix.mode }}-results-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}
