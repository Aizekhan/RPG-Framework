# Installed by RPG Framework > Game Kit > Install AI Guidance (only when this file did not exist).
# Runs the EditMode and PlayMode tests (architecture rules included) on every push and pull request.
# Needs the repository secrets UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD (https://game.ci/docs/github/activation).
# Without them the run FAILS: a green check that tested nothing hides broken games. An EditMode run that reports
# no tests fails too (an assembly that does not load reports 0 tests, not an error); PlayMode may have none yet.
name: Unity tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.mode }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [editmode, playmode]
    permissions:
      contents: read
      checks: write
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity license secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Unity tests NOT RUN: set the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets (https://game.ci/docs/github/activation)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: ${{ matrix.mode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.mode }} results
      - name: Check that tests ran
        if: matrix.mode == 'editmode'
        run: |
          total=0
          for report in $(find "${{ steps.tests.outputs.artifactsPath }}" -name '*.xml'); do
            count=$(grep -o '<test-run [^>]*' "$report" | grep -o ' total="[0-9]*"' | grep -o '[0-9]*' || true)
            total=$((total + ${count:-0}))
          done
          echo "Tests run: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::No EditMode tests ran: a test assembly failed to load, or the game has no tests."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.mode }}-results
          path: ${{ steps.tests.outputs.artifactsPath }}
